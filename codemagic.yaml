workflows:
  android-release:
    name: SafePrep Refresher Android Release
    instance_type: linux_x2
    max_build_duration: 60
    environment:
      android_signing:
        - safeprep_upload        # the upload keystore added in CodeMagic -> Code signing identities
      flutter: stable
    scripts:
      - name: Write key.properties from the CodeMagic keystore
        script: |
          cat > "$CM_BUILD_DIR/android/key.properties" <<EOF
          storePassword=$CM_KEYSTORE_PASSWORD
          keyPassword=$CM_KEY_PASSWORD
          keyAlias=$CM_KEY_ALIAS
          storeFile=$CM_KEYSTORE_PATH
          EOF
      - name: Get Flutter packages
        script: flutter pub get
      - name: Build Android app bundle
        script: flutter build appbundle --release --build-number=$(($(date +%s) / 60 - 29000000))
    artifacts:
      - build/app/outputs/bundle/release/*.aab
  ios-release:
    name: SafePrep Refresher iOS Release
    max_build_duration: 60
    environment:
      groups:
        - ios_signing
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Get Flutter packages
        script: flutter pub get
      - name: Build iOS
        script: |
          flutter build ios --release --no-codesign
          xcode-project build-ipa \
            --workspace ios/Runner.xcworkspace \
            --scheme Runner
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        api_key: 
        key_id: 
        issuer_id: 
        submit_to_testflight: true
        submit_to_app_store: false
